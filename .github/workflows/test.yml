name: Verify SimpliCITY Builder v0.1.5

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Agent Skills structure (local structural checks)
        run: python3 -m unittest tests/test_skill_structure.py -v
      - name: Generate and validate four worlds
        run: |
          for theme in fairytale space custom clockwork; do
            python3 simplicity-builder/scripts/build_portfolio.py --input "examples/${theme}-sample.json" --output "/tmp/${theme}.html"
            python3 simplicity-builder/scripts/validate.py "examples/${theme}-sample.json" "/tmp/${theme}.html"
          done
      - name: Check public bundle preparation (offline)
        run: |
          python3 simplicity-builder/scripts/publish_portfolio.py prepare \
            --html /tmp/space.html --account DemoUser --repo career-world \
            --preview docs/assets/space-social.jpg --out /tmp/test-publish
          test -f /tmp/test-publish/site/index.html
          grep -q 'og:image' /tmp/test-publish/site/index.html
      - name: Build installable skill archive and checksum manifest
        run: python3 scripts/package_release.py --label v0.1.5-rc.1

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium browser test dependency
        run: |
          python3 -m pip install 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium
      - name: Test actual HTML in desktop and mobile Chromium
        run: |
          python3 scripts/browser_smoke.py docs/fairytale.html docs/space.html docs/festival.html docs/clockwork.html --screenshots private/screenshots
      - name: Save screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-screenshots
          path: private/screenshots/
          if-no-files-found: ignore
